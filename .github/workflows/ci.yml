name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: Formato
        run: gofmt -l . && test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # El detector de carreras (-race) requiere cgo: los runners de Windows de
      # GitHub no lo traen, así que ahí se corre sin detector.
      - name: Pruebas con detector de carreras
        if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - name: Pruebas (Windows, sin -race)
        if: matrix.os == 'windows-latest'
        run: go test ./...
      - name: Análisis de vulnerabilidades
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v6
        with:
          # v2 con soporte de Go 1.27 (el 'latest' del action resuelve v1 y no
          # puede analizar el go.mod con go 1.27).
          version: v2.14.0
          args: --timeout 5m
