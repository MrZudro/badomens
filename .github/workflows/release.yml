name: Release

# 🚀 Se lanza en cada etiqueta v* :
#   - v0.1.0       → release ESTABLE
#   - v0.1.0-rc.0  → PRE-RELEASE (marcada por GoReleaser con prerelease: auto)
# Ver .goreleaser.yaml para la lista de binarios y el changelog.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: 🏷️ Etiqueta detectada
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: 📦 Ejecutar GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}